# Build and deploy the docs site (docs-site/) to Cloudflare Workers.
#
# The site publishes guides read in place from docs/guides/, so a guide edit
# runs this workflow too. ci.yml (iOS) and ci-node.yml (plugin / relay /
# codegen) use positive path filters that include neither path.
#
# A pull request tests, typechecks, builds, and checks links; a push to main
# also deploys. The deploy uses the same two repository secrets as landing.yml:
#
#   CLOUDFLARE_API_TOKEN    scoped to Workers Scripts:Edit on the account that
#                           owns the bybee.dev zone
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
#
# wrangler comes from docs-site/package-lock.json rather than a third-party
# action, so the deploying binary is the same one `npm run deploy` uses locally.

name: Docs site

on:
  pull_request:
    paths:
      - docs-site/**
      - docs/guides/**
      - .github/workflows/docs-site.yml
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/guides/**
      - .github/workflows/docs-site.yml

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # Internal links, heading anchors, and the published page set.
      - name: Check links
        run: npm run check:links

      # Only main deploys; a pull request stops at a verified build.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
